name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # This repo carries its own lore, so the tool validates itself on every push.
      - run: node dist/cli.js check --strict

  # One stable check for branch protection to require. Without it the ruleset
  # would have to name every matrix leg, and adding a Node version would
  # silently stop being required.
  gate:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix job passed
        if: needs.build.result != 'success'
        run: |
          echo "build was: ${{ needs.build.result }}"
          exit 1

